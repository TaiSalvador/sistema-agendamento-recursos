<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atualizar Recurso</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">Template</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/home}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/usuariolista}">Usuários</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/recursolista}">Recursos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/login}">Sair</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Atualizar Recurso</h3>
                </div>
                <div class="card-body">
                    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
                    <form th:action="@{/recursoatualizar}" th:object="${recurso}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="mb-3">
                            <label class="form-label">Descrição</label>
                            <input type="text" class="form-control" th:field="*{descricao}"
                                   th:classappend="${#fields.hasErrors('descricao')} ? ' is-invalid'">
                            <div class="invalid-feedback" th:errors="*{descricao}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tipo</label>
                            <input type="text" class="form-control" th:field="*{tipo}"
                                   th:classappend="${#fields.hasErrors('tipo')} ? ' is-invalid'">
                            <div class="invalid-feedback" th:errors="*{tipo}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Dias disponíveis</label>
                            <div class="border rounded p-3">
                                <div class="form-check"
                                     th:each="dia : ${T(com.sistema_agendamento_recursos.senai.entities.DiaSemana).values()}">
                                    <input class="form-check-input" type="checkbox" th:field="*{diasDisponiveis}"
                                           th:value="${dia}">
                                    <label class="form-check-label" th:text="${dia}"></label>
                                </div>
                            </div>
                            <div class="text-danger mt-2" th:errors="*{diasDisponiveis}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Data Inicial</label>
                            <input type="date" class="form-control" th:field="*{dataInicialAgendamento}"
                                   th:classappend="${#fields.hasErrors('dataInicialAgendamento')} ? ' is-invalid'">
                            <div class="invalid-feedback" th:errors="*{dataInicialAgendamento}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Data Final</label>
                            <input type="date"
                                   class="form-control"
                                   th:field="*{dataFinalAgendamento}"
                                   th:classappend="${#fields.hasErrors('dataFinalAgendamento')} ? ' is-invalid'">

                            <div class="invalid-feedback"
                                 th:errors="*{dataFinalAgendamento}">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Hora Inicial</label>
                            <input type="time" class="form-control" th:field="*{horaInicialAgendamento}"
                                   th:classappend="${#fields.hasErrors('horaInicialAgendamento')} ? ' is-invalid'">
                            <div class="invalid-feedback" th:errors="*{horaInicialAgendamento}">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Hora Final</label>
                            <input type="time" class="form-control" th:field="*{horaFinalAgendamento}"
                                   th:classappend="${#fields.hasErrors('horaFinalAgendamento')} ? ' is-invalid'">
                            <div class="invalid-feedback" th:errors="*{horaFinalAgendamento}"></div>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a class="btn btn-outline-secondary" th:href="@{/recursolista}">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Atualizar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
