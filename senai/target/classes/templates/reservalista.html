<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de Reservas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/home}">Gestor de Reservas</a>

    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuPrincipal">

      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" th:href="@{/home}">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" th:href="@{/usuariolista}">Usuários</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" th:href="@{/recursolista}">Recursos</a>
        </li>

        <li class="nav-item">
          <a class="nav-link active" th:href="@{/reservalista}">Reservas</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" th:href="@{/login}">Sair</a>
        </li>

      </ul>

    </div>
  </div>
</nav>

<main class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-3">

    <h2>Lista de Reservas</h2>

    <div>

      <a class="btn btn-danger me-2"
         th:href="@{/reservalistacancelada}">
        Reservas Canceladas
      </a>

      <a class="btn btn-success"
         th:href="@{/reservainserir}">
        Nova Reserva
      </a>

    </div>

  </div>

  <div class="alert alert-success"
       th:if="${mensagem}"
       th:text="${mensagem}">
  </div>

  <div class="card shadow">

    <div class="card-body">

      <table class="table table-striped table-hover align-middle">

        <thead class="table-primary">

        <tr>
          <th>ID</th>
          <th>Usuário</th>
          <th>Recurso</th>
          <th>Data</th>
          <th>Hora Inicial</th>
          <th>Hora Final</th>
          <th>Ações</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="reserva : ${reservas}"
            th:if="${reserva.dataCancelamento == null}">

          <td th:text="${reserva.id}"></td>

          <td th:text="${reserva.nomeUsuario}"></td>

          <td th:text="${reserva.descricaoRecurso}"></td>

          <td th:text="${reserva.data}"></td>

          <td th:text="${reserva.horaInicial}"></td>

          <td th:text="${reserva.horaFinal}"></td>

          <td>

            <a class="btn btn-info btn-sm"
               th:href="@{/reservavisualizar/{id}(id=${reserva.id})}">
              Visualizar
            </a>

          </td>

        </tr>

        <tr th:if="${#lists.isEmpty(reservas)}">

          <td colspan="7" class="text-center">
            Nenhuma reserva cadastrada.
          </td>

        </tr>

        </tbody>

      </table>

    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
