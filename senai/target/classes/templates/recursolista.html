<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Recursos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
    <div class="container">

        <a class="navbar-brand" th:href="@{/home}">
            Gestor de Reservas
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/home}">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/usuariolista}">
                        Usuários
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/recursolista}">
                        Recursos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/reservalista}">Reservas</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/login}">
                        Sair
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2>Recursos</h2>

            <p class="text-secondary">
                Lista de recursos cadastrados.
            </p>

        </div>

        <a class="btn btn-primary"
           th:href="@{/recursoinserir}">

            Novo recurso

        </a>

    </div>

    <!-- Mensagem de sucesso -->

    <div class="alert alert-success"
         th:if="${mensagem}"
         th:text="${mensagem}">
    </div>

    <!-- Mensagem de erro -->

    <div class="alert alert-danger"
         th:if="${erro}"
         th:text="${erro}">
    </div>

    <div class="card shadow">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover table-striped align-middle">

                    <thead class="table-primary">

                    <tr>

                        <th>ID</th>
                        <th>Descrição</th>
                        <th>Tipo</th>
                        <th>Dias disponíveis</th>
                        <th>Data Inicial</th>
                        <th>Data Final</th>
                        <th>Hora Inicial</th>
                        <th>Hora Final</th>
                        <th class="text-center">Ações</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="recurso : ${recursos}">

                        <td th:text="${recurso.id}"></td>

                        <td th:text="${recurso.descricao}"></td>

                        <td th:text="${recurso.tipo}"></td>

                        <td>
                            <span th:each="dia, status : ${recurso.diasDisponiveis}">
                                <span th:text="${dia}"></span><span th:if="${!status.last}">, </span>
                            </span>
                        </td>

                        <td th:text="${recurso.dataInicialAgendamento}"></td>

                        <td th:text="${recurso.dataFinalAgendamento}"></td>

                        <td th:text="${recurso.horaInicialAgendamento}"></td>

                        <td th:text="${recurso.horaFinalAgendamento}"></td>

                        <td class="text-center">

                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/recursoatualizar/{id}(id=${recurso.id})}">

                                Editar

                            </a>

                            <button class="btn btn-sm btn-outline-danger excluir"
                                    th:data-id="${recurso.id}">

                                Excluir

                            </button>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(recursos)}">

                        <td colspan="9"
                            class="text-center text-muted">

                            Nenhum recurso cadastrado.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>

<script>

    document.querySelectorAll(".excluir").forEach(botao => {

        botao.addEventListener("click", function () {

            const id = this.dataset.id;

            if(confirm("Deseja realmente excluir este recurso?")){

                fetch("/recursoexcluir/" + id,{

                    method:"DELETE"

                }).then(() => {

                    location.reload();

                });

            }

        });

    });

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
