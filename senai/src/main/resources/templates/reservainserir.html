<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova Reserva</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/home}">Template</a>

    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" th:href="@{/home}">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" th:href="@{/usuariolista}">Usuários</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" th:href="@{/recursolista}">Recursos</a>
        </li>

        <li class="nav-item">
          <a class="nav-link active" th:href="@{/reservalista}">Reservas</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" th:href="@{/login}">Sair</a>
        </li>

      </ul>
    </div>
  </div>
</nav>

<main class="container py-4">

  <div class="row justify-content-center">

    <div class="col-lg-8">

      <div class="card shadow">

        <div class="card-header bg-primary text-white">
          <h3 class="mb-0">Nova Reserva</h3>
        </div>

        <div class="card-body">

          <form th:action="@{/reservainserir}"
                th:object="${reserva}"
                method="post">

            <div class="mb-3">

              <label class="form-label">
                Usuário
              </label>

              <input type="number"
                     class="form-control"
                     th:field="*{usuario}"
                     th:classappend="${#fields.hasErrors('usuario')} ? ' is-invalid'">

              <div class="invalid-feedback"
                   th:errors="*{usuario}">
              </div>

            </div>

            <div class="mb-3">

              <label class="form-label">
                Recurso
              </label>

              <input type="number"
                     class="form-control"
                     th:field="*{recurso}"
                     th:classappend="${#fields.hasErrors('recurso')} ? ' is-invalid'">

              <div class="invalid-feedback"
                   th:errors="*{recurso}">
              </div>

            </div>

            <div class="mb-3">

              <label class="form-label">
                Data
              </label>

              <input type="date"
                     class="form-control"
                     th:field="*{data}"
                     th:classappend="${#fields.hasErrors('data')} ? ' is-invalid'">

              <div class="invalid-feedback"
                   th:errors="*{data}">
              </div>

            </div>

            <div class="mb-3">

              <label class="form-label">
                Hora Inicial
              </label>

              <input type="time"
                     class="form-control"
                     th:field="*{horaInicial}"
                     th:classappend="${#fields.hasErrors('horaInicial')} ? ' is-invalid'">

              <div class="invalid-feedback"
                   th:errors="*{horaInicial}">
              </div>

            </div>

            <div class="mb-4">

              <label class="form-label">
                Hora Final
              </label>

              <input type="time"
                     class="form-control"
                     th:field="*{horaFinal}"
                     th:classappend="${#fields.hasErrors('horaFinal')} ? ' is-invalid'">

              <div class="invalid-feedback"
                   th:errors="*{horaFinal}">
              </div>

            </div>

            <div class="d-flex justify-content-end gap-2">

              <a class="btn btn-outline-secondary"
                 th:href="@{/reservas}">
                Cancelar
              </a>

              <button class="btn btn-primary"
                      type="submit">
                Salvar
              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
