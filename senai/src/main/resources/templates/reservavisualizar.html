<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualizar Reserva</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/home}">Template</a>

    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuPrincipal">

      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" th:href="@{/home}">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" th:href="@{/usuariolista}">Usuários</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" th:href="@{/recursolista}">Recursos</a>
        </li>

        <li class="nav-item">
          <a class="nav-link active" th:href="@{/reservalista}">Reservas</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" th:href="@{/login}">Sair</a>
        </li>

      </ul>

    </div>
  </div>
</nav>

<main class="container py-4">

  <div class="row justify-content-center">

    <div class="col-lg-8">

      <div class="card shadow">

        <div class="card-header bg-primary text-white">
          <h3 class="mb-0">Visualizar Reserva</h3>
        </div>

        <div class="card-body">

          <div class="mb-3">
            <label class="form-label">ID</label>
            <input type="text"
                   class="form-control"
                   th:value="${reserva.id}"
                   readonly>
          </div>

          <div class="mb-3">
            <label class="form-label">Usuário</label>
            <input type="text"
                   class="form-control"
                   th:value="${reserva.usuario}"
                   readonly>
          </div>

          <div class="mb-3">
            <label class="form-label">Recurso</label>
            <input type="text"
                   class="form-control"
                   th:value="${reserva.recurso}"
                   readonly>
          </div>

          <div class="mb-3">
            <label class="form-label">Data</label>
            <input type="date"
                   class="form-control"
                   th:value="${reserva.data}"
                   readonly>
          </div>

          <div class="mb-3">
            <label class="form-label">Hora Inicial</label>
            <input type="time"
                   class="form-control"
                   th:value="${reserva.horaInicial}"
                   readonly>
          </div>

          <div class="mb-3">
            <label class="form-label">Hora Final</label>
            <input type="time"
                   class="form-control"
                   th:value="${reserva.horaFinal}"
                   readonly>
          </div>

          <div class="mb-3">
            <label class="form-label">Data de Cancelamento</label>
            <input type="date"
                   class="form-control"
                   th:value="${reserva.dataCancelamento}"
                   readonly>
          </div>

          <div class="mb-4">
            <label class="form-label">Observação</label>
            <textarea class="form-control"
                      rows="3"
                      readonly
                      th:text="${reserva.observacao}">
                        </textarea>
          </div>

          <div class="d-flex justify-content-end">

            <a class="btn btn-secondary"
               th:href="@{/reservalista}">
              Voltar
            </a>

          </div>

        </div>

      </div>

    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
